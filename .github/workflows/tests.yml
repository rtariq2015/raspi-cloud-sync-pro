name: Development checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  samba-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated Debian Samba fixture
        run: docker build -t raspi-cloud-samba-ci tools/acceptance/samba
      - name: Check real share locks without host networking or devices
        run: |
          docker run --rm --network none --pids-limit 128 --memory 256m \
            --security-opt no-new-privileges \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/work,readonly \
            raspi-cloud-samba-ci
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Test and check the staged-file watcher
        working-directory: rust
        run: |
          rustup run 1.100.0 cargo test --locked
          rustup run 1.100.0 cargo fmt --all -- --check
          rustup run 1.100.0 cargo clippy --locked --all-targets -- -D warnings
      - name: Cross-build for the Pi using the reviewed Debian toolchain
        run: |
          docker build -t raspi-cloud-rust-ci tools/rust-build
          mkdir -p "$RUNNER_TEMP/raspi-cargo"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/cargo \
            -v "$RUNNER_TEMP/raspi-cargo":/cargo \
            -v "$GITHUB_WORKSPACE":/work -w /work/rust \
            raspi-cloud-rust-ci \
            cargo build --locked --release --target aarch64-unknown-linux-gnu
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only the new Python package
        run: python -m pip install '.[dashboard]'
      - name: Fetch pinned rclone for local-only integration (Python 3.12)
        if: matrix.python-version == '3.12'
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip --output "$RUNNER_TEMP/rclone.zip"
          python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          archive_path = root / "rclone.zip"
          expected = "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7"
          assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive_path) as archive:
              executable = archive.read("rclone-v1.76.0-linux-amd64/rclone")
          (root / "rclone").write_bytes(executable)
          (root / "rclone").chmod(0o700)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"RASPI_TEST_RCLONE={root / 'rclone'}\n")
          PY
      - name: Run hardware-free regression tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI and example configuration
        run: |
          raspi-cloud-sync-pro status
          raspi-cloud-sync-pro check-config config/config.example.json
          raspi-cloud-sync-pro mode-plan config/device.example.json
          raspi-cloud-sync-pro diagnostics --mode ethernet_samba
          raspi-cloud-sync-pro worker-plan --config config/worker.example.json
          raspi-cloud-sync-pro worker-plan --config config/worker-dropbox.example.json
          raspi-cloud-sync-pro wifi-plan config/wifi-enterprise.example.json
      - name: Check Python and retained shell syntax
        run: |
          python -m compileall -q src/raspi_cloud_sync_pro src/home/pi tests
          sh -n src/home/pi/execute_setup_bullseye.sh
          sh -n src/home/pi/execute_setup_bookworm.sh
          sh -n tools/cloudstick/upload.sh
          git diff --check
