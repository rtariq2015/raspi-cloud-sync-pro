# REVIEW TEMPLATE ONLY: separate instance, bound exclusively to the USB interface.
interface=usb0
bind-dynamic
port=0
dhcp-authoritative
dhcp-range=10.12.194.2,10.12.194.14,255.255.255.240,2m
# No router or DNS advertisement; preserve the computer's normal default route.
dhcp-option=3
dhcp-option=6
