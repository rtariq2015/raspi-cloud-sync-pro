# REVIEW TEMPLATE ONLY: separate smbd configuration, not a blind append to an existing server.
[global]
    server role = standalone server
    workgroup = WORKGROUP
    interfaces = lo usb0
    bind interfaces only = yes
    hosts allow = 127.0.0.1 10.12.194.0/28
    smb ports = 445
    server min protocol = SMB3_00
    server signing = mandatory
    smb encrypt = required
    map to guest = Never
    restrict anonymous = 2
    load printers = no
    disable spoolss = yes
    usershare allow guests = no

[CloudSync]
    path = /srv/raspi-cloud-sync-pro/share
    browseable = yes
    read only = yes
    guest ok = no
    valid users = raspi-share raspi-backup
    write list = raspi-share
    force group = raspi-sync
    create mask = 0640
    force create mode = 0640
    directory mask = 0750
    force directory mode = 0750
    follow symlinks = no
    wide links = no
    strict locking = yes
    strict sync = yes
    csc policy = disable
    # Local writers cannot honor SMB share modes. Keep this volume SMB-only.
