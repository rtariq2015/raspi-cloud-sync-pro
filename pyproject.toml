[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi-cloud-sync-pro"
version = "0.1.0.dev7"
description = "A safety-first Raspberry Pi USB-to-cloud backup project"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
raspi-cloud-sync-pro = "raspi_cloud_sync_pro.cli:main"

[project.optional-dependencies]
ethernet = ["smbprotocol>=1.15,<2; python_version >= '3.10'"]
dashboard = ["Flask>=3.1,<4", "waitress>=3.0.2,<4"]

[project.urls]
Repository = "https://github.com/rtariq2015/raspi-cloud-sync-pro"
Issues = "https://github.com/rtariq2015/raspi-cloud-sync-pro/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["raspi_cloud_sync_pro*"]
namespaces = false

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt"]

[tool.setuptools.package-data]
raspi_cloud_sync_pro = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]
