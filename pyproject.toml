[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raspi-cloud-sync-pro"
version = "0.1.0.dev0"
description = "A safety-first Raspberry Pi USB-to-cloud backup project"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
raspi-cloud-sync-pro = "raspi_cloud_sync_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["raspi_cloud_sync_pro*"]
namespaces = false
