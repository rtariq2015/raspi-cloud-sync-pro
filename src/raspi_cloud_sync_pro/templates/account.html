<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172c45"><title>Account · Raspi Cloud Sync Pro</title><link rel="stylesheet" href="/static/dashboard.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-symbol">R</div><p class="eyebrow">YOUR ACCOUNT</p><h1>Change your password</h1><p class="muted">{{ user.username }} · {{ user.role|capitalize }}</p>
{% if message %}<p class="notice error" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/account"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="current-password">Current password</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" maxlength="256" required autofocus><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirmation">Confirm new password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button class="primary wide" type="submit">Change password and sign out</button></form>
<p class="fine">Use 12–256 characters. Changing your password signs this account out on every device. Your account role stays the same.</p><p><a href="/">← Back to dashboard</a></p></main></body></html>
