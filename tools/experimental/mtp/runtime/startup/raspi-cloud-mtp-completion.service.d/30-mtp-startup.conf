[Unit]
Requires=raspi-cloud-mtp-prepare.service
After=raspi-cloud-mtp-prepare.service

[Service]
ExecStartPre=+/opt/raspi-cloud-sync-pro/experimental/mtp/start-mtp check
# '+' intentionally runs this fixed read-only root guard outside the broker's
# mount sandbox so it can authenticate the protected host inventory. It does
# not change the restrictions applied to the existing long-running ExecStart.
# Preserve the accepted broker ExecStart, account and sandbox, including its
# separately reviewed machine-specific shared-publication drop-in.
